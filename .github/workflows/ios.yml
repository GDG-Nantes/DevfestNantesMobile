name: iOS CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  JAVA_VERSION: 17

jobs:
  ios-build:
    name: iOS Build Check
    runs-on: macos-latest
    timeout-minutes: 30
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - uses: ./.github/actions/android-setup
        with:
          java-version: ${{ env.JAVA_VERSION }}
          cache-read-only: ${{ github.event_name == 'pull_request' }}

      - name: Cache Kotlin Multiplatform builds
        uses: actions/cache@v4
        with:
          path: |
            ~/.konan
            shared/build
            shared/.gradle
            core/*/build
          key: ${{ runner.os }}-kmp-${{ hashFiles('shared/**/*.kt', 'shared/build.gradle.kts', 'core/**/*.kt', 'core/**/build.gradle.kts', 'build-logic/**/*.kt', 'build-logic/**/*.kts', 'gradle/libs.versions.toml') }}
          restore-keys: |
            ${{ runner.os }}-kmp-
      
      - name: Cache Homebrew
        uses: actions/cache@v4
        with:
          path: |
            ~/Library/Caches/Homebrew
            /usr/local/Homebrew
          key: ${{ runner.os }}-homebrew-${{ hashFiles('**/Brewfile') }}
          restore-keys: |
            ${{ runner.os }}-homebrew-
      
      - name: Cache SwiftGen
        uses: actions/cache@v4
        with:
          path: /usr/local/bin/swiftgen
          key: ${{ runner.os }}-swiftgen-${{ hashFiles('iosApp/iosApp/SwiftGen/swiftgen.yml') }}
          restore-keys: |
            ${{ runner.os }}-swiftgen-
      
      - name: Install SwiftGen
        run: |
          if ! command -v swiftgen &> /dev/null; then
            brew install swiftgen
          else
            echo "SwiftGen already installed"
          fi
      
      - name: Select latest installed Xcode
        id: xcode
        run: |
          LATEST_XCODE=$(ls -d /Applications/Xcode_*.app 2>/dev/null \
            | sed -E 's#.*/Xcode_([0-9.]+)\.app#\1#' \
            | sort -V \
            | tail -1)
          echo "Selected Xcode: ${LATEST_XCODE}"
          sudo xcode-select -s "/Applications/Xcode_${LATEST_XCODE}.app/Contents/Developer"
          # Version-build, e.g. 26.6-17A123: the DerivedData cache is keyed on it
          echo "version=$(xcodebuild -version | awk 'NR==1{v=$2} NR==2{b=$3} END{print v "-" b}')" >> "$GITHUB_OUTPUT"

      - name: Show Xcode version
        run: xcodebuild -version

      # After Xcode selection on purpose: the key carries the selected Xcode version, so
      # DerivedData built by another Xcode is never restored.
      - name: Cache Xcode DerivedData
        uses: actions/cache@v4
        with:
          path: |
            ~/Library/Developer/Xcode/DerivedData
            build
          key: ${{ runner.os }}-xcode-${{ steps.xcode.outputs.version }}-deriveddata-${{ hashFiles('iosApp/iosApp.xcodeproj/project.pbxproj') }}-${{ hashFiles('shared/**/*.kt', 'core/**/*.kt') }}
          restore-keys: |
            ${{ runner.os }}-xcode-${{ steps.xcode.outputs.version }}-deriveddata-${{ hashFiles('iosApp/iosApp.xcodeproj/project.pbxproj') }}-
            ${{ runner.os }}-xcode-${{ steps.xcode.outputs.version }}-deriveddata-

      - name: Show available simulators
        run: xcrun simctl list devices available

      - name: Resolve and boot latest iPhone simulator
        id: sim
        run: |
          # Latest iOS runtime, then highest plain "iPhone N"; selected by UDID because a
          # device name can exist in several runtimes.
          read -r UDID NAME < <(xcrun simctl list devices available --json | jq -r '
            [ .devices | to_entries[]
              | select(.key | test("SimRuntime\\.iOS-"))
              | (.key | capture("iOS-(?<v>[0-9-]+)$").v | split("-") | map(tonumber)) as $rt
              | .value[]
              | select(.isAvailable == true and (.name | test("^iPhone [0-9]+$")))
              | {udid, name, rt: $rt, n: (.name | capture("^iPhone (?<n>[0-9]+)$").n | tonumber)} ]
            | sort_by([.rt, .n]) | last | "\(.udid) \(.name)"')
          if [ -z "${UDID:-}" ] || [ "$UDID" = "null" ]; then
            echo "::error::No available plain iPhone simulator found"
            exit 1
          fi
          echo "Resolved simulator: ${NAME} (${UDID})"
          echo "udid=$UDID" >> "$GITHUB_OUTPUT"
          echo "name=$NAME" >> "$GITHUB_OUTPUT"
          # Booting an already-booted device is an error, hence the tolerance
          xcrun simctl boot "$UDID" || true
          xcrun simctl bootstatus "$UDID" -b

      - name: Build shared framework
        run: |
          # Set required Xcode environment variables for the Gradle task
          export SDK_NAME=iphonesimulator
          export CONFIGURATION=Debug
          export TARGET_BUILD_DIR=${{ github.workspace }}/build/ios
          export BUILT_PRODUCTS_DIR=${{ github.workspace }}/build/ios
          export FRAMEWORKS_FOLDER_PATH=Frameworks
          export ARCHS=arm64
          
          # Create the target directory
          mkdir -p "$TARGET_BUILD_DIR"
          
          # Run the Gradle task with Xcode environment
          ./gradlew :shared:embedAndSignAppleFrameworkForXcode
      
      - name: Run shared and core iOS tests
        run: ./gradlew :shared:iosSimulatorArm64Test :core:model:iosSimulatorArm64Test :core:data:iosSimulatorArm64Test :core:testing:iosSimulatorArm64Test

      - name: Cache SwiftGen generated files
        uses: actions/cache@v4
        with:
          path: |
            iosApp/iosApp/SwiftGen/Strings.swift
            iosApp/iosApp/SwiftGen/Assets.swift
          key: ${{ runner.os }}-swiftgen-generated-${{ hashFiles('iosApp/iosApp/Resources/**/*', 'iosApp/iosApp/SwiftGen/swiftgen.yml') }}
          restore-keys: |
            ${{ runner.os }}-swiftgen-generated-
      
      - name: Generate SwiftGen files
        working-directory: iosApp/iosApp/SwiftGen
        run: |
          if [ ! -f "Strings.swift" ] || [ ! -f "Assets.swift" ]; then
            echo "Generating SwiftGen files..."
            swiftgen config run
          else
            echo "SwiftGen files already exist and are cached"
          fi
      
      - name: Create mock GoogleService-Info.plist for CI
        run: |
          # Create a minimal mock GoogleService-Info.plist file for CI builds
          cat > iosApp/iosApp/GoogleService-Info.plist << 'EOF'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>API_KEY</key>
            <string>mock-api-key-for-ci</string>
            <key>GCM_SENDER_ID</key>
            <string>123456789</string>
            <key>PLIST_VERSION</key>
            <string>1</string>
            <key>BUNDLE_ID</key>
            <string>com.gdgnantes.devfest.iosApp</string>
            <key>PROJECT_ID</key>
            <string>mock-project-id</string>
            <key>STORAGE_BUCKET</key>
            <string>mock-project-id.appspot.com</string>
            <key>IS_ADS_ENABLED</key>
            <false/>
            <key>IS_ANALYTICS_ENABLED</key>
            <false/>
            <key>IS_APPINVITE_ENABLED</key>
            <false/>
            <key>IS_GCM_ENABLED</key>
            <true/>
            <key>IS_SIGNIN_ENABLED</key>
            <false/>
            <key>GOOGLE_APP_ID</key>
            <string>1:123456789:ios:mock-app-id</string>
            <key>DATABASE_URL</key>
            <string>https://mock-project-id.firebaseio.com</string>
          </dict>
          </plist>
          EOF
          echo "Created mock GoogleService-Info.plist for CI"
      
      - name: List available schemes
        run: |
          echo "Listing project schemes and targets..."
          xcodebuild -project iosApp/iosApp.xcodeproj -list
          echo "Project listing complete."
      
      - name: Resolve Swift Package Dependencies
        run: |
          echo "Resolving Swift Package dependencies..."
          xcodebuild \
            -project iosApp/iosApp.xcodeproj \
            -resolvePackageDependencies
          echo "Package dependencies resolved."

      # One build of the app and its test bundle; the tests run from these products below.
      - name: Build app and tests for testing
        env:
          SIM_UDID: ${{ steps.sim.outputs.udid }}
        run: |
          echo "Starting iOS build for testing..."
          xcodebuild \
            -project iosApp/iosApp.xcodeproj \
            -scheme "iosApp" \
            -testPlan iosApp \
            -configuration Debug \
            -destination "platform=iOS Simulator,id=$SIM_UDID" \
            -derivedDataPath build \
            build-for-testing \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            PROVISIONING_PROFILE=""

      # No retry, no iteration and no failure tolerance on purpose: a flaky test must fail
      # the job. The result bundle lives outside the cached build/ directory and must not
      # pre-exist. xcodebuild exits 0 on a zero-test run, which the next step catches.
      - name: Run Swift tests
        env:
          SIM_UDID: ${{ steps.sim.outputs.udid }}
        run: |
          rm -rf "$RUNNER_TEMP/ios-tests.xcresult"
          xcodebuild \
            -project iosApp/iosApp.xcodeproj \
            -scheme "iosApp" \
            -testPlan iosApp \
            -configuration Debug \
            -destination "platform=iOS Simulator,id=$SIM_UDID" \
            -derivedDataPath build \
            -resultBundlePath "$RUNNER_TEMP/ios-tests.xcresult" \
            -parallel-testing-enabled NO \
            test-without-building

      - name: Assert tests executed
        shell: bash
        run: |
          bash scripts/xcresult-assert-tests.sh selftest
          bash scripts/xcresult-assert-tests.sh "$RUNNER_TEMP/ios-tests.xcresult" | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Job summary
        if: always()
        env:
          XCODE_VERSION: ${{ steps.xcode.outputs.version }}
          SIM_NAME: ${{ steps.sim.outputs.name }}
          SIM_UDID: ${{ steps.sim.outputs.udid }}
        run: |
          {
            echo "### iOS tests"
            echo ""
            echo "- Xcode: ${XCODE_VERSION}"
            echo "- Simulator: ${SIM_NAME} (${SIM_UDID})"
          } >> "$GITHUB_STEP_SUMMARY"

      # Test logs only (built with the mock GoogleService-Info.plist, no secrets)
      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ios-xcresult
          path: ${{ runner.temp }}/ios-tests.xcresult
          if-no-files-found: ignore
          retention-days: 7
